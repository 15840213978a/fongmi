name: Inspect ISO navigation reference

on:
  push:
    branches:
      - codex/disc-dovi-rebuild-20260929

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download retained 5.6.6 navigation reference
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nav-ref"
          gh run download 36399587394 \
            --repo 15840213978a/fongmi \
            --name official-5.6.6-native-inspection \
            --dir "$RUNNER_TEMP/nav-ref"
          test -f "$RUNNER_TEMP/nav-ref/decompiled/IsoNavigationSession.java"

      - name: Print verified navigation session
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/nav-ref/decompiled/IsoNavigationSession.java"
          echo '===== SESSION METHODS ====='
          grep -n -E 'nativeRead|nativePump|nativeSelectTitle|nativeSeekToTimeUs|nativeSeekToChapter|menuActive|waitingForDrain|public final boolean S\(|public final int [a-zA-Z]\(|public final synchronized' "$src" || true
          sed -n '200,720p' "$src"

      - name: Download official 5.6.7 mobile arm64
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-all-errors \
            "https://github.com/FongMi/Release/releases/download/5.6.7/mobile-arm64_v8a.apk" \
            --output "$RUNNER_TEMP/official-567.apk"
          echo "5428c11d5aa09813dfa2fde8a32be2beeeddfc45d093b89e46ed53cd696a3b3c  $RUNNER_TEMP/official-567.apk" | sha256sum --check

      - name: Decompile official 5.6.7 references
        run: |
          set -euo pipefail
          tool="$RUNNER_TEMP/jadx.zip"
          curl --fail --location --retry 3 --retry-all-errors \
            "https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip" \
            --output "$tool"
          echo '545ea2be9c242511bc145755cf4bda2485ade42966e096f8b4d3da2a230e8974  '"$tool" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/jadx" "$RUNNER_TEMP/official-src"
          unzip -q "$tool" -d "$RUNNER_TEMP/jadx"
          chmod +x "$RUNNER_TEMP/jadx/bin/jadx"
          "$RUNNER_TEMP/jadx/bin/jadx" --no-res --threads-count 4 \
            -d "$RUNNER_TEMP/official-src" "$RUNNER_TEMP/official-567.apk" >/dev/null 2>&1 || true

          echo '===== ALL IsoNavigationSession REFERENCES ====='
          grep -R -n -B 6 -A 18 'IsoNavigationSession' "$RUNNER_TEMP/official-src/sources" | head -n 1400 || true
          echo '===== NAV ACTION CALLS ====='
          grep -R -n -B 10 -A 30 -E '\.S\([0-9]+\)|\.S\([^)]*\)|nativeRead\(|waitingForDrain|resumeDvdWait' "$RUNNER_TEMP/official-src/sources/androidx/media3" | head -n 1800 || true
