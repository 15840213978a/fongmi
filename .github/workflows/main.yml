name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      JAVA_HOME: /opt/hostedtoolcache/Java_Temurin-Hotspot_jdk/21.0.12-1/x64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Download Official Apktool JAR
        run: |
          wget -q https://github.com/iBotPeaches/Apktool/releases/download/v2.12.0/apktool_2.12.0.jar \
            -O /tmp/apktool.jar
          chmod +x /tmp/apktool.jar

      - name: Verify workspace and decode if needed
        run: |
          echo "Current directory: $(pwd)"
          ls -la
          if [ ! -d "decoded_dir" ]; then
            echo "decoded_dir not found. Looking for an APK to decode..."
            # 找到仓库根目录下的第一个 .apk 文件作为原始包
            ORIGINAL_APK=$(find . -maxdepth 1 -name "*.apk" | head -n 1)
            if [ -z "$ORIGINAL_APK" ]; then
              echo "Error: no .apk file found in repository root. Please add your original APK."
              exit 1
            fi
            echo "Decoding $ORIGINAL_APK -> decoded_dir"
            java -jar /tmp/apktool.jar d "$ORIGINAL_APK" -o decoded_dir
          else
            echo "decoded_dir already exists, skipping decode."
          fi

      - name: Build APK with Official Apktool
        run: |
          java -jar /tmp/apktool.jar b decoded_dir -o unsigned.apk

      - name: Upload Unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-apk
          path: unsigned.apk
          if-no-files-found: error
