name: Build TV APKs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. 克隆配套的 Media3 源码（FongMi 定制版）
      - name: Checkout matching FongMi Media3 source
        uses: actions/checkout@v4
        with:
          repository: FongMi/media
          ref: 3c2cbe8ac742c2fe15eff52f03eeb3b1b648848d
          path: media3
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Ensure Android SDK 37 and NDK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1 || true)"
          fi
          
          if [ -z "${SDKMANAGER:-}" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found under $SDK_ROOT"
            exit 1
          fi

          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          set -o pipefail

          "$SDKMANAGER" --channel=3 \
            "platforms;android-37.0" \
            "platforms;android-36" \
            "build-tools;37.0.0" \
            "cmake;3.22.1" \
            "ndk;29.0.14206865" \
            "platform-tools"

          echo "Android SDK and NDK installed."

      # 2. 下载官方 5.6.8 版本 APK，用于提取缺失的原生库
      - name: Download verified official 5.6.8 APKs
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fongmi-official-568"
          curl --fail --location --retry 3 --retry-all-errors \
            --connect-timeout 20 --max-time 600 \
            "https://github.com/FongMi/Release/releases/download/5.6.8/mobile-arm64_v8a.apk" \
            --output "$RUNNER_TEMP/fongmi-official-568/mobile-arm64_v8a.apk"
          curl --fail --location --retry 3 --retry-all-errors \
            --connect-timeout 20 --max-time 600 \
            "https://github.com/FongMi/Release/releases/download/5.6.8/mobile-armeabi_v7a.apk" \
            --output "$RUNNER_TEMP/fongmi-official-568/mobile-armeabi_v7a.apk"
          echo "Official APKs downloaded."

      # 3. 提取并放置原生库和 JNI 桥接
      - name: Stage official native payloads and FFmpeg
        run: |
          # 这里需要你仓库里的脚本，如果没有，你需要从上游项目获取
          # 如果脚本不存在，这里会报错，你需要根据你的源码结构进行调整
          if [ -f scripts/stage_official_native_test.py ]; then
            python3 scripts/stage_official_native_test.py \
              --arm64 "$RUNNER_TEMP/fongmi-official-568/mobile-arm64_v8a.apk" \
              --armeabi "$RUNNER_TEMP/fongmi-official-568/mobile-armeabi_v7a.apk" \
              --app-root app \
              --report official-native-stage.json
            cat official-native-stage.json
          else
            echo "::warning::Native staging scripts not found. Build may fail due to missing MPV libraries."
          fi

      # 4. 编译 Media3 AAR 库
      - name: Build matching FongMi Media3 AARs
        env:
          GRADLE_OPTS: "-Dorg.gradle.internal.http.connectionTimeout=120000 -Dorg.gradle.internal.http.socketTimeout=120000"
        run: |
          set -euo pipefail
          if [ -f media3/move.txt ]; then
            MEDIA_TASKS=()
            while IFS= read -r AAR || [ -n "$AAR" ]; do
              AAR="${AAR%$'\r'}"
              [ -n "$AAR" ] || continue
              MODULE="${AAR%-release.aar}"
              MEDIA_TASKS+=(":${MODULE}:assembleRelease")
            done < media3/move.txt

            ./media3/gradlew -p media3 "${MEDIA_TASKS[@]}" --stacktrace --no-daemon

            # 将编译好的 AAR 复制到 app/libs
            while IFS= read -r AAR || [ -n "$AAR" ]; do
              AAR="${AAR%$'\r'}"
              [ -n "$AAR" ] || continue
              SOURCE="$(find media3 -type f -path "*/outputs/aar/$AAR" -print -quit)"
              if [ -n "$SOURCE" ]; then
                cp "$SOURCE" app/libs/"$AAR"
              fi
            done < media3/move.txt
            echo "Media3 AARs built and copied."
          else
            echo "::warning::media3/move.txt not found. Skipping Media3 build."
          fi

      # 5. 构建最终的 APK（针对 64 位，避免 32 位缺失问题）
      - name: Build release APKs
        env:
          GRADLE_OPTS: "-Dorg.gradle.internal.http.connectionTimeout=120000 -Dorg.gradle.internal.http.socketTimeout=120000"
        run: |
          set -euo pipefail
          ./gradlew \
            -Dorg.gradle.jvmargs="-Xmx4096m -Dfile.encoding=UTF-8 --add-exports jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED" \
            :app:assembleLeanbackArm64_v8aRelease \
            :app:assembleMobileArm64_v8aRelease \
            --max-workers=1 \
            --stacktrace \
            --no-daemon

      # 6. 上传构建产物
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: TV-APKs
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
