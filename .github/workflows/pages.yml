name: Inject Source into Official APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      # 1. 下载官方 APK（使用你提供的真实链接）
      - name: Download Official APK
        run: |
          # 使用你刚刚提供的链接
          APK_URL="https://github.com/15840213978a/fongmi/releases/download/5.8.3-official/mobile-arm64_v8a.apk"
          
          echo "尝试下载: $APK_URL"
          curl -fL -o original.apk "$APK_URL"
          
          # 检查文件大小，防止下载到 404 网页或错误文件
          MIN_SIZE=$((1024 * 1024))
          ACTUAL_SIZE=$(stat -c%s "original.apk")
          if [ "$ACTUAL_SIZE" -lt "$MIN_SIZE" ]; then
            echo "::error::下载的 APK 大小异常 ($ACTUAL_SIZE 字节)，可能链接失效或返回了网页。"
            exit 1
          fi
          echo "下载成功，文件大小: $ACTUAL_SIZE 字节"

      # 2. 安装所需工具
      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y apktool
          wget -q https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar -O uber-apk-signer.jar

      # 3. 解包 APK
      - name: Decode APK
        run: |
          apktool d -f original.apk -o decoded_dir

      # 4. 注入内置源
      - name: Inject Source Config
        run: |
          mkdir -p decoded_dir/assets
          # 注意：FongMi 实际的配置文件可能叫 config.json 或 default.json，请解包后确认
          CONFIG_PATH="decoded_dir/assets/config.json"
          
          cat > "$CONFIG_PATH" << 'EOF'
          {
            "sites": [
              {
                "key": "my_source",
                "name": "我的内置源",
                "type": 3,
                "api": "https://你的接口地址/api.php/provide/vod/",
                "searchable": 1,
                "quickSearch": 1
              }
            ]
          }
          EOF
          echo "内置源已注入 $CONFIG_PATH"

      # 5. 重新打包
      - name: Rebuild APK
        run: |
          apktool b decoded_dir -o unsigned.apk

      # 6. 签名 APK
      - name: Sign APK
        run: |
          java -jar uber-apk-signer.jar --apk unsigned.apk --allowResign --overwrite
          
          if [ -f "unsigned-aligned-signed.apk" ]; then
            mv unsigned-aligned-signed.apk final.apk
          elif [ -f "unsigned-signed.apk" ]; then
            mv unsigned-signed.apk final.apk
          else
            echo "::warning::未找到签好名的包，尝试兜底处理"
            mv unsigned.apk final.apk || exit 1
          fi
          ls -lh final.apk

      # 7. 上传成品
      - name: Upload Final APK
        uses: actions/upload-artifact@v4
        with:
          name: FongMi-Custom-APK
          path: final.apk
          if-no-files-found: error
          retention-days: 7
