name: Build TV with Built-in Source

on:
  push:
    branches: [ main, fongmi ] # 你的分支名叫 fongmi 还是 main？这里都包含了
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Ensure Android SDK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1 || true)"
          fi
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          set -o pipefail
          "$SDKMANAGER" --channel=3 \
            "platforms;android-37.0" \
            "platforms;android-36" \
            "build-tools;37.0.0" \
            "cmake;3.22.1" \
            "ndk;29.0.14206865" \
            "platform-tools"
          echo "Android SDK installed."

      # =========================================================
      # 关键步骤：把你的内置源注入到项目中
      # =========================================================
      - name: Inject Built-in Source
        run: |
          # 1. 假设 FongMi 源码的默认配置在 app/src/main/assets/config.json
          # 2. 这里用你的真实源地址替换下面 URL
          # 3. 使用 sed 命令直接修改文件，或者用 echo 覆盖
          
          echo "::notice::正在注入内置源..."
          
          # 注意：FongMi 的配置文件可能不叫 config.json，请检查你的源码！
          CONFIG_FILE="app/src/main/assets/config.json"
          
          if [ -f "$CONFIG_FILE" ]; then
            # 如果你的源是纯 URL，直接写入
            echo '{"spider":"https://your-source-url.com/api.php/provide/vod/"}' > "$CONFIG_FILE"
            
            # 或者如果是完整的 TVBox 配置 JSON（包含站点列表），建议用 curl 下载覆盖：
            # curl -sL "https://your-source-json-url.com/config.json" -o "$CONFIG_FILE"
            
            echo "::notice::内置源已写入 $CONFIG_FILE"
          else
            echo "::warning::未找到 $CONFIG_FILE，请检查源码结构！"
            # 可以尝试找一下其他默认配置路径
            find app/src/main/assets -name "*.json" | head -n 5
          fi

      # =========================================================
      # 尝试编译（大概率会因为缺 media3 报错）
      # =========================================================
      - name: Build APKs
        env:
          GRADLE_OPTS: "-Dorg.gradle.internal.http.connectionTimeout=120000 -Dorg.gradle.internal.http.socketTimeout=120000"
        run: |
          set -euo pipefail
          # 只编译 64 位版本，避免 32 位缺库报错
          ./gradlew \
            -Dorg.gradle.jvmargs="-Xmx4096m -Dfile.encoding=UTF-8" \
            :app:assembleLeanbackArm64_v8aRelease \
            :app:assembleMobileArm64_v8aRelease \
            --max-workers=1 \
            --stacktrace \
            --no-daemon

      - name: Upload APKs
        if: always() # 即使编译失败，也尝试上传产物（如果生成了的话）
        uses: actions/upload-artifact@v4
        with:
          name: TV-APKs
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
          retention-days: 7
