name: Inject Source into Official APK

on:
  workflow_dispatch: # 允许手动点击运行

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      # 1. 下载最新（或指定版本）的官方 APK
      - name: Download Official APK
        run: |
          # 这里以 5.8.3 版本的 leanback-arm64 为例，你可以根据需要修改
          APK_URL="https://github.com/15840213978a/fongmi/releases/download/v5.8.3/leanback-arm64_v8a.apk"
          echo "正在下载 APK: $APK_URL"
          curl -L -o original.apk "$APK_URL"
          echo "下载完成，文件大小："
          ls -lh original.apk

      # 2. 安装 APK 工具（apktool 用于解包和重打包，uber-apk-signer 用于签名）
      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y apktool
          wget https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar -O uber-apk-signer.jar

      # 3. 解包 APK
      - name: Decode APK
        run: |
          apktool d -f original.apk -o decoded_dir

      # 4. 注入你的内置源（修改 assets 目录下的配置文件）
      - name: Inject Source Config
        run: |
          # 注意：FongMi 的配置文件可能叫 config.json，也可能在 assets/default.json，请解包后确认
          CONFIG_PATH="decoded_dir/assets/config.json"
          
          # 如果没有找到 config.json，就创建一个
          if [ ! -f "$CONFIG_PATH" ]; then
            echo "::warning::未找到 config.json，尝试在其他位置查找"
            # 这里可以添加查找逻辑，比如 find decoded_dir/assets -name "*.json"
            # 为了演示，我们直接在 assets 根目录建一个
            CONFIG_PATH="decoded_dir/assets/config.json"
            mkdir -p decoded_dir/assets
          fi
          
          # 写入你的源。这里用的是一个示例格式，你需要替换成你真实的 TVBox 配置 JSON 或者接口地址
          # 如果你的配置很长，建议把 JSON 放在这个仓库里，然后用 cp 命令复制过去
          echo '{
            "sites": [
              {
                "key": "my_source",
                "name": "我的内置源",
                "type": 3,
                "api": "https://你的接口地址/api.php/provide/vod/",
                "searchable": 1,
                "quickSearch": 1
              }
            ]
          }' > "$CONFIG_PATH"
          
          echo "内置源已注入到 $CONFIG_PATH"

      # 5. 重新打包 APK
      - name: Rebuild APK
        run: |
          apktool b decoded_dir -o unsigned.apk
          echo "重打包完成"

      # 6. 对 APK 进行签名（使用 debug 签名，或者你自己的 release 签名）
      - name: Sign APK
        run: |
          # 使用 uber-apk-signer 自动生成并应用 debug 签名
          java -jar uber-apk-signer.jar --apk unsigned.apk --allowResign --overwrite
          
          # 重命名签好名的包
          mv unsigned-aligned-signed.apk final.apk
          echo "签名完成"
          ls -lh final.apk

      # 7. 上传最终的 APK
      - name: Upload Final APK
        uses: actions/upload-artifact@v4
        with:
          name: FongMi-Custom-APK
          path: final.apk
          retention-days: 7
