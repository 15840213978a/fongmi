name: Publish latest official FongMi APKs to Release

on:
  workflow_dispatch:
  schedule:
    # 每天 UTC 02:00（北京时间 10:00）检查一次上游最新版本
    - cron: '0 2 * * *'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Resolve latest FongMi/Release tag
        id: latest
        shell: bash
        run: |
          set -euo pipefail
          tag=$(curl --fail --location --retry 3 --retry-all-errors \
            --connect-timeout 20 --max-time 60 \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/FongMi/Release/releases/latest" \
            | python3 -c 'import sys,json; print(json.load(sys.stdin)["tag_name"])')
          echo "Latest upstream tag: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Download APKs for that tag
        shell: bash
        env:
          TAG: ${{ steps.latest.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/apks"
          # 列出该 Release 下所有 .apk 附件并逐个下载
          curl --fail --location --retry 3 --retry-all-errors \
            --connect-timeout 20 --max-time 120 \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/FongMi/Release/releases/tags/${TAG}" \
            --output "$RUNNER_TEMP/release.json"
          python3 - <<'PY' > "$RUNNER_TEMP/urls.txt"
          import json, os
          data = json.load(open(os.environ["RUNNER_TEMP"] + "/release.json"))
          for asset in data.get("assets", []):
              name = asset["name"]
              if name.endswith(".apk"):
                  print(asset["browser_download_url"] + "\t" + name)
          PY
          if [ ! -s "$RUNNER_TEMP/urls.txt" ]; then
            echo "::error::No APK assets found for tag $TAG"
            exit 1
          fi
          while IFS=$'\t' read -r url name; do
            echo "Downloading $name ..."
            curl --fail --location --retry 3 --retry-all-errors \
              --connect-timeout 20 --max-time 600 \
              "$url" --output "$RUNNER_TEMP/apks/$name"
            ls -la "$RUNNER_TEMP/apks/$name"
          done < "$RUNNER_TEMP/urls.txt"

      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.latest.outputs.tag }}-official
          name: FongMi ${{ steps.latest.outputs.tag }} 官方构建
          body: |
            直接来自 FongMi/Release 的官方 ${{ steps.latest.outputs.tag }} APK。

            来源：https://github.com/FongMi/Release/releases/tag/${{ steps.latest.outputs.tag }}
          files: |
            ${{ runner.temp }}/apks/*.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
