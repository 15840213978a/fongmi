name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      JAVA_HOME: /opt/hostedtoolcache/Java_Temurin-Hotspot_jdk/21.0.12-1/x64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Download Official Apktool JAR
        run: |
          # 下载官方 apktool.jar，避免使用 apt 安装的损坏版本
          wget -q https://github.com/iBotPeaches/Apktool/releases/download/v2.12.0/apktool_2.12.0.jar \
            -O /tmp/apktool.jar
          chmod +x /tmp/apktool.jar

      - name: Build APK with Official Apktool
        run: |
          # 用 java -jar 直接调用，替代有问题的 apktool 命令
          java -jar /tmp/apktool.jar b decoded_dir -o unsigned.apk

      - name: Upload Unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-apk
          path: unsigned.apk
          if-no-files-found: error
