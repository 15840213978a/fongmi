name: Build FongMi 5.8.0 APK

on:
  push:
    branches:
      - "**"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fongmi-580-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Leanback and Mobile APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 尝试获取缺失的 AAR 依赖
      - name: Fetch local AAR dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/libs

          # 1. 尝试下载 lib-decoder-ffmpeg-release.aar (来源：第三方 Gitee 仓库)
          if [ ! -f "app/libs/lib-decoder-ffmpeg-release.aar" ]; then
            echo "lib-decoder-ffmpeg-release.aar 不存在，尝试从 Gitee 下载..."
            curl -L -o app/libs/lib-decoder-ffmpeg-release.aar \
              "https://gitee.com/mzhsy/MzDKPlayer/raw/main/app/libs/lib-decoder-ffmpeg-release.aar" || {
              echo "::error::下载 lib-decoder-ffmpeg-release.aar 失败。"
              exit 1
            }
            # 简单校验文件大小，避免下载到错误页面
            if [ $(stat -c%s "app/libs/lib-decoder-ffmpeg-release.aar") -lt 1000000 ]; then
              echo "::error::下载的文件过小，可能不是有效的 AAR 文件。"
              exit 1
            fi
            echo "lib-decoder-ffmpeg-release.aar 下载完成。"
          else
            echo "lib-decoder-ffmpeg-release.aar 已存在。"
          fi

          # 2. 检查 lib-mpvplayer-release.aar (无公开源，必须手动提供)
          if [ ! -f "app/libs/lib-mpvplayer-release.aar" ]; then
            echo "::error::缺少 lib-mpvplayer-release.aar。"
            echo "FongMi/TV 官方说明配套 AAR 未纳入 Git，且此文件无公开下载源。"
            echo "请从你获取源码的原始渠道找到该文件，放入仓库的 app/libs/ 目录后重新运行。"
            exit 1
          else
            echo "lib-mpvplayer-release.aar 已存在。"
          fi

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager was not found."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" --channel=3 --install \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;37.0.0"

          if [ ! -d "$SDK_ROOT/platforms/android-37.0" ]; then
            echo "::error::Android SDK platform 37.0 was not installed."
            ls -la "$SDK_ROOT/platforms" 2>/dev/null || true
            exit 1
          fi

          if [ ! -e "$SDK_ROOT/platforms/android-37" ]; then
            ln -s "$SDK_ROOT/platforms/android-37.0" "$SDK_ROOT/platforms/android-37"
          fi

          test -d "$SDK_ROOT/build-tools/37.0.0" || {
            echo "::error::Android Build Tools 37.0.0 were not installed."
            exit 1
          }

      - name: Create temporary CI signing key
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/fongmi-ci.keystore" \
            -storetype JKS \
            -alias fongmi-ci \
            -keyalg RSA -keysize 2048 -validity 3650 \
            -storepass "ci-only-password" -keypass "ci-only-password" \
            -dname "CN=FongMi CI, OU=Build, O=CI, L=CI, ST=CI, C=US"
          printf 'storeFile=%s\nkeyAlias=fongmi-ci\nstorePassword=ci-only-password\n' \
            "$RUNNER_TEMP/fongmi-ci.keystore" > local.properties
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" >> local.properties

      - name: Verify Gradle wrapper
        run: |
          chmod +x ./gradlew
          ./gradlew --version

      - name: Run unit tests
        run: ./gradlew --no-daemon :catvod:test

      - name: Build release APKs
        run: ./gradlew --no-daemon --stacktrace :app:assembleLeanbackRelease :app:assembleMobileRelease

      - name: List APK outputs
        if: always()
        shell: bash
        run: |
          find app/build/outputs -type f -name '*.apk' -print 2>/dev/null || true

      - name: Upload APK artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FongMi-5.8.0-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
