name: Build FongMi 5.8.0 APK

on:
  push:
    branches:
      - "**"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fongmi-580-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Leanback and Mobile APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Use the Android SDK preinstalled on GitHub-hosted runners.
      # android-actions/setup-android@v3 failed while requesting the obsolete "tools" package.
      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager was not found in the runner's preinstalled Android SDK."
            exit 1
          fi

          # API 37 / Build Tools 37 may be published on the preview channel.
          # Enable all SDK license prompts before installing the exact versions
          # declared in gradle/libs.versions.toml.
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --channel=3 --install \
            "platform-tools" \
            "platforms;android-37" \
            "build-tools;37.0.0"

          # Fail early with a clear message if the requested SDK packages were
          # not actually installed, rather than failing later inside Gradle.
          # NOTE: the installed directory may be "android-37" or "android-37.0",
          # so match the prefix instead of hard-coding the exact name.
          PLATFORM_DIR="$(find "$SDK_ROOT/platforms" -maxdepth 1 -type d -name 'android-37*' 2>/dev/null | head -n 1 || true)"
          if [ -z "$PLATFORM_DIR" ]; then
            echo "::error::Android SDK platform 37 was not installed. Check SDK repository availability."
            echo "Contents of $SDK_ROOT/platforms:"
            ls -la "$SDK_ROOT/platforms" 2>/dev/null || true
            exit 1
          fi
          echo "Found Android platform directory: $PLATFORM_DIR"

          test -d "$SDK_ROOT/build-tools/37.0.0" || {
            echo "::error::Android Build Tools 37.0.0 were not installed."
            echo "Contents of $SDK_ROOT/build-tools:"
            ls -la "$SDK_ROOT/build-tools" 2>/dev/null || true
            exit 1
          }

      - name: Create temporary CI signing key
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/fongmi-ci.keystore" \
            -storetype JKS \
            -alias fongmi-ci \
            -keyalg RSA -keysize 2048 -validity 3650 \
            -storepass "ci-only-password" -keypass "ci-only-password" \
            -dname "CN=FongMi CI, OU=Build, O=CI, L=CI, ST=CI, C=US"
          printf 'storeFile=%s\nkeyAlias=fongmi-ci\nstorePassword=ci-only-password\n' \
            "$RUNNER_TEMP/fongmi-ci.keystore" > local.properties
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" >> local.properties

      - name: Verify Gradle wrapper
        run: |
          chmod +x ./gradlew
          ./gradlew --version

      - name: Run unit tests
        run: ./gradlew --no-daemon :catvod:test

      - name: Build release APKs
        run: ./gradlew --no-daemon --stacktrace :app:assembleLeanbackRelease :app:assembleMobileRelease

      - name: List APK outputs
        if: always()
        shell: bash
        run: |
          find app/build/outputs -type f -name '*.apk' -print 2>/dev/null || true

      - name: Upload APK artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FongMi-5.8.0-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
