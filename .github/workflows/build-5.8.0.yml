name: Build FongMi 5.8.0 APK

on:
  push:
    branches:
      - upgrade/official-5.8.0-base
      - fongmi
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - fongmi
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fongmi-580-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Leanback and Mobile APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-37" "build-tools;37.0.0"
          yes | sdkmanager --licenses >/dev/null

      - name: Create temporary CI signing key
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/fongmi-ci.keystore" \
            -storetype JKS \
            -alias fongmi-ci \
            -keyalg RSA -keysize 2048 -validity 3650 \
            -storepass "ci-only-password" -keypass "ci-only-password" \
            -dname "CN=FongMi CI, OU=Build, O=CI, L=CI, ST=CI, C=US"
          printf 'storeFile=%s\nkeyAlias=fongmi-ci\nstorePassword=ci-only-password\n' \
            "$RUNNER_TEMP/fongmi-ci.keystore" > local.properties
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" >> local.properties

      - name: Verify Gradle wrapper
        run: |
          chmod +x ./gradlew
          ./gradlew --version

      - name: Run unit tests
        run: ./gradlew --no-daemon :catvod:test

      - name: Build release APKs
        run: ./gradlew --no-daemon --stacktrace :app:assembleLeanbackRelease :app:assembleMobileRelease

      - name: List APK outputs
        if: always()
        shell: bash
        run: |
          find app/build/outputs -type f -name '*.apk' -print 2>/dev/null || true

      - name: Upload APK artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FongMi-5.8.0-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

# Re-submitted to trigger the 5.8.0 build workflow.
